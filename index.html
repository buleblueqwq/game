<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070b16">
<meta name="description" content="NEON ARCADE — 38 款硬核 HTML5 小游戏合集：Canvas / WebGL / WebAudio / Three.js，程序化音乐，全离线可玩。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NEON ARCADE · 霓虹游戏厅</title>
<meta property="og:title" content="NEON ARCADE · 霓虹游戏厅">
<meta property="og:description" content="38 款硬核网页小游戏：塔防、Roguelike、弹幕、物理沙盒、AI 算法、3D 迷宫、音游……">
<meta property="og:image" content="./assets/og.svg">
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<link rel="apple-touch-icon" href="./assets/icon.svg">
<link rel="manifest" href="./assets/manifest.webmanifest">
<link rel="preload" href="./styles/app.css" as="style">
<link rel="stylesheet" href="./styles/app.css">
</head>
<body>
  <noscript>
    <div style="padding:60px 20px;text-align:center;font-family:system-ui">
      <h1 style="color:#22e0ff">NEON ARCADE</h1>
      <p>这个游戏厅需要 JavaScript 才能运行，请在浏览器中启用后刷新。</p>
    </div>
  </noscript>

  <div id="app"></div>

  <!-- 首屏骨架：模块加载前即刻呈现，保证 LCP < 1s -->
  <div id="boot" aria-hidden="true">
    <div class="boot-logo">
      <span>NEON</span><span>ARCADE</span>
    </div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-txt">正在点亮霓虹…</div>
  </div>

  <style>
    #boot{position:fixed;inset:0;z-index:999;display:grid;place-content:center;gap:16px;justify-items:center;
      background:#070b16;transition:opacity .45s}
    #boot.gone{opacity:0;pointer-events:none}
    .boot-logo{display:flex;gap:12px;font-weight:900;font-size:clamp(30px,7vw,58px);letter-spacing:-.02em}
    .boot-logo span:first-child{background:linear-gradient(180deg,#fff,#22e0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
    .boot-logo span:last-child{background:linear-gradient(180deg,#fff,#ff2e88);-webkit-background-clip:text;background-clip:text;color:transparent}
    .boot-bar{width:180px;height:4px;border-radius:99px;background:#131c33;overflow:hidden}
    .boot-bar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#22e0ff,#ff2e88);
      animation:bootslide 1.1s ease-in-out infinite}
    @keyframes bootslide{0%{transform:translateX(-110%)}100%{transform:translateX(270%)}}
    .boot-txt{font-size:12px;color:#8296bd;letter-spacing:.14em}
  </style>
  <script>
    // 移除骨架屏（模块就绪或 2.5s 超时兜底）
    window.__bootDone = function () {
      var b = document.getElementById('boot');
      if (b) { b.classList.add('gone'); setTimeout(function () { b.remove(); }, 500); }
    };
    setTimeout(window.__bootDone, 2500);
    // WebGL / Canvas 能力预检失败时的降级提示
    try {
      var c = document.createElement('canvas');
      if (!(c.getContext('2d'))) throw new Error('no-canvas');
    } catch (e) {
      document.getElementById('boot').innerHTML =
        '<div style="padding:40px;text-align:center"><h2 style="color:#ff4d5e">浏览器不支持 Canvas</h2><p style="color:#8296bd">请更换现代浏览器（Chrome / Edge / Safari / Firefox）后重试。</p></div>';
    }
  </script>
  <script type="module" src="./src/shell/main.js"></script>
  <script>addEventListener('load', function(){ setTimeout(window.__bootDone, 120); });</script>
</body>
</html>
